name: Android Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (optional)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.7.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses & Install API 37 Components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"
          test -f "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_SDK_ROOT}/build-tools/37.0.0/aapt"

      - name: Verify Gradle installation
        run: gradle --version

      - name: Inspect Secrets & Prepare Keystore
        id: check_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "HAS_SECRETS=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets detected. Building signed production APK."
          else
            echo "HAS_SECRETS=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not detected or incomplete. Building unsigned release APK."
          fi

      - name: Verify Groq free-tier API (optional)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          # Groq is optional. API authentication, quota, or outage errors must not block Android builds.
          set -uo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::notice::GROQ_API_KEY is not configured; Android web search/crawling remains available without AI."
            exit 0
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code=""
          if http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"Reply exactly GROQ_OK"}],"max_tokens":12}')"; then
            curl_status=0
          else
            curl_status=$?
          fi

          if [ "$curl_status" -eq 0 ] && [ "$http_code" = "200" ]; then
            echo "::notice::Groq GPT-OSS 120B API endpoint returned HTTP 200."
          else
            echo "::warning::Groq verification unavailable (HTTP ${http_code:-network error}, curl exit $curl_status); continuing Android build."
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Require signing secrets for public releases
        if: ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag_name, 'v'))) && steps.check_secrets.outputs.HAS_SECRETS != 'true'
        run: |
          echo "Version-tag releases require configured production signing secrets."
          exit 1

      - name: Build & Sign Release APK
        env:
          HAS_SECRETS: ${{ steps.check_secrets.outputs.HAS_SECRETS }}
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p release-artifacts

          # Locate Android SDK build-tools for apksigner and zipalign
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"

          GRADLE_BIN="gradle"

          if [ "$HAS_SECRETS" = "true" ]; then
            echo "=== Decoding Keystore Secret ==="
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.keystore"

            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/release.keystore"
            export STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export KEY_PASSWORD="$KEY_PASSWORD"

            echo "=== Building Release APK ==="
            $GRADLE_BIN :app:assembleRelease --no-daemon --stacktrace

            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -z "$RAW_APK" ]; then
              echo "Error: Release APK not found after assembleRelease task!"
              exit 1
            fi

            echo "=== Aligning and Signing Release APK with apksigner ==="
            "$APKSIGNER" sign \
              --ks "${GITHUB_WORKSPACE}/release.keystore" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "release-artifacts/KaspaBrowser-release-signed.apk" \
              "$RAW_APK"

            echo "=== Verifying Signed APK ==="
            "$APKSIGNER" verify --verbose "release-artifacts/KaspaBrowser-release-signed.apk"
            echo "Signed Release APK successfully generated: release-artifacts/KaspaBrowser-release-signed.apk"

            # Remove sensitive keystore from disk
            rm -f "${GITHUB_WORKSPACE}/release.keystore"
          else
            echo "=== Building Unsigned Release APK ==="
            keytool -genkey -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -storepass \
              -keypass  \
              -dname "CN=Temporary, OU=Temp, O=Temp, L=Temp, S=Temp, C=US"

            export STORE_PASSWORD=temp1234
            export KEY_PASSWORD=temp1234

            $GRADLE_BIN :app:assembleRelease --no-daemon --stacktrace

            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -z "$RAW_APK" ]; then
              echo "Error: Release APK not found after assembleRelease task!"
              exit 1
            fi

            cp "$RAW_APK" "release-artifacts/KaspaBrowser-release-unsigned.apk"
            zip -d "release-artifacts/KaspaBrowser-release-unsigned.apk" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/MANIFEST.MF" "META-INF/SIG-*" || true

            echo "Unsigned Release APK successfully generated: release-artifacts/KaspaBrowser-release-unsigned.apk"
            rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
          fi

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.$(date +'%Y%m%d%H%M%S')"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="KaspaBrowser ${TAG}"
          fi
          echo "TITLE=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Generate release APK SHA-256
        id: apk_checksum
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag_name, 'v'))
        shell: bash
        run: |
          set -euo pipefail
          APK="release-artifacts/KaspaBrowser-release-signed.apk"
          test -s "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag_name, 'v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            KaspaBrowser Android Release

            - Android release APK
            - Built from commit ${{ github.sha }}
            - SHA-256: ${{ steps.apk_checksum.outputs.sha256 }}
          files: |
            release-artifacts/KaspaBrowser-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: kaspabrowser-release-apk
          path: release-artifacts/*.apk
          if-no-files-found: error
