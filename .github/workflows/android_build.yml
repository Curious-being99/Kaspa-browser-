name: Android Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (optional)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK Licenses & Install API 36 Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Prepare Gradle & Wrapper Executable
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found in repository. Generating gradle wrapper..."
            gradle wrapper || true
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Inspect Secrets & Prepare Keystore
        id: check_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "HAS_SECRETS=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets detected. Building signed production APK."
          else
            echo "HAS_SECRETS=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not detected or incomplete. Building unsigned release APK."
          fi

      - name: Build & Sign Release APK
        env:
          HAS_SECRETS: ${{ steps.check_secrets.outputs.HAS_SECRETS }}
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p release-artifacts

          # Locate Android SDK build-tools for apksigner and zipalign
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"

          # Determine Gradle executable (wrapper or CLI)
          if [ -f "./gradlew" ]; then
            GRADLE_BIN="./gradlew"
          else
            GRADLE_BIN="gradle"
          fi

          if [ "$HAS_SECRETS" = "true" ]; then
            echo "=== Decoding Keystore Secret ==="
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.keystore"

            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/release.keystore"
            export STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export KEY_PASSWORD="$KEY_PASSWORD"

            echo "=== Building Release APK ==="
            $GRADLE_BIN :app:assembleRelease --no-daemon --stacktrace

            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -z "$RAW_APK" ]; then
              echo "Error: Release APK not found after assembleRelease task!"
              exit 1
            fi

            echo "=== Aligning and Signing Release APK with apksigner ==="
            "$APKSIGNER" sign \
              --ks "${GITHUB_WORKSPACE}/release.keystore" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "release-artifacts/KaspaBrowser-release-signed.apk" \
              "$RAW_APK"

            echo "=== Verifying Signed APK ==="
            "$APKSIGNER" verify --verbose "release-artifacts/KaspaBrowser-release-signed.apk"
            echo "Signed Release APK successfully generated: release-artifacts/KaspaBrowser-release-signed.apk"

            # Remove sensitive keystore from disk
            rm -f "${GITHUB_WORKSPACE}/release.keystore"
          else
            echo "=== Building Unsigned Release APK ==="
            keytool -genkey -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -storepass temp1234 \
              -keypass temp1234 \
              -dname "CN=Temporary, OU=Temp, O=Temp, L=Temp, S=Temp, C=US"

            export STORE_PASSWORD=temp1234
            export KEY_PASSWORD=temp1234

            $GRADLE_BIN :app:assembleRelease --no-daemon --stacktrace

            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -z "$RAW_APK" ]; then
              echo "Error: Release APK not found after assembleRelease task!"
              exit 1
            fi

            cp "$RAW_APK" "release-artifacts/KaspaBrowser-release-unsigned.apk"
            zip -d "release-artifacts/KaspaBrowser-release-unsigned.apk" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/MANIFEST.MF" "META-INF/SIG-*" || true

            echo "Unsigned Release APK successfully generated: release-artifacts/KaspaBrowser-release-unsigned.apk"
            rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
          fi

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.$(date +'%Y%m%d%H%M%S')"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="KaspaBrowser ${TAG}"
          fi
          echo "TITLE=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: ${{ steps.release_info.outputs.TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: kaspabrowser-release-apk
          path: release-artifacts/*.apk
          if-no-files-found: error
