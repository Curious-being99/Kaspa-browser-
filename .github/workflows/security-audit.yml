name: Security Audit

on:
  push:
    branches:
      - main
      - master
      - draft/evm-kasplex-igra-provider-clean
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: cpp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java for Android build
        if: matrix.language == 'cpp' || matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Set up Android SDK for Kotlin and Java analysis
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        if: matrix.language == 'java-kotlin'
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle for Kotlin and Java analysis
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generate CI debug keystore
        if: matrix.language == 'java-kotlin'
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android app for CodeQL tracing
        if: matrix.language == 'java-kotlin'
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Set up Android SDK and NDK
        if: matrix.language == 'cpp'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and CMake
        if: matrix.language == 'cpp'
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build native C++ library with Android NDK
        if: matrix.language == 'cpp'
        shell: bash
        run: |
          set -euo pipefail
          ndk_dir="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          cmake -S app/src/main/cpp -B "${RUNNER_TEMP}/native-mmap-cache-build" \
            -DCMAKE_TOOLCHAIN_FILE="${ndk_dir}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build "${RUNNER_TEMP}/native-mmap-cache-build" --parallel 2

      - name: Prepare SARIF output directory
        run: mkdir -p "${GITHUB_WORKSPACE}/results"

      - name: Analyze source without uploading to conflicting default Code Scanning setup
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: "${{ github.workspace }}/results"
          upload: false

      - name: Upload CodeQL SARIF reports as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: results/*.sarif
          if-no-files-found: error
          retention-days: 14

  rust-source:
    name: Rust source security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan Rust source with Semgrep
        run: |
          python -m pip install --disable-pip-version-check 'semgrep==1.144.0' 'pydantic<2.14'
          semgrep scan --config p/rust --metrics=off --error -j 1 --max-memory 500 --optimizations none --include '*.rs' .

      - name: Scan Kotlin and Java security rules with Semgrep
        run: |
          semgrep scan --config p/security-audit --metrics=off --error -j 1 --max-memory 500 --include '*.kt' --include '*.java' .

      - name: Scan Rust security rules with Semgrep
        run: |
          semgrep scan --config p/security-audit --metrics=off --error -j 1 --max-memory 500 --include '*.rs' .

      - name: Scan remaining shared source security rules with Semgrep
        run: |
          semgrep scan --config p/security-audit --metrics=off --error -j 1 --max-memory 500 --include '*.yml' --include '*.yaml' --include '*.json' --include '*.py' --include '*.sh' --include '*.js' --include 'Dockerfile*' .

  android-dependencies:
    name: Android dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Audit resolved Gradle dependencies with OWASP Dependency-Check
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/dependency-check.init.gradle" <<'EOF'
          initscript {
            repositories {
              gradlePluginPortal()
              mavenCentral()
            }
            dependencies {
              classpath 'org.owasp:dependency-check-gradle:12.2.2'
            }
          }
          allprojects {
            apply plugin: org.owasp.dependencycheck.gradle.DependencyCheckPlugin
            dependencyCheck {
              failBuildOnCVSS = 7.0
              formats = ['HTML', 'JSON']
              scanSet = []
              analyzers {
                nodeAudit.enabled = false
                nodePackage.enabled = false
              }
              outputDirectory = "${System.getenv('RUNNER_TEMP')}/dependency-check-report"
              nvd {
                validForHours = 24
              }
            }
          }
          EOF
          gradle --no-daemon --stacktrace -I "${RUNNER_TEMP}/dependency-check.init.gradle" :app:dependencyCheckAnalyze
          test -s "${RUNNER_TEMP}/dependency-check-report/dependency-check-report.json"

      - name: Upload Android dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-dependency-vulnerability-report
          path: ${{ runner.temp }}/dependency-check-report/
          if-no-files-found: warn
          retention-days: 14

  rust-dependencies:
    name: Rust dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Audit Rust dependencies when Cargo.lock exists
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t lockfiles < <(find . -name Cargo.lock -not -path './target/*' -not -path './.git/*' -print)
          if (( ${#lockfiles[@]} == 0 )); then
            echo 'No Cargo.lock found; no locked Rust dependency graph to audit.'
            exit 0
          fi
          cargo install cargo-audit --locked
          for lockfile in "${lockfiles[@]}"; do
            echo "Auditing Rust dependencies in $(dirname "$lockfile")"
            cargo audit --file "$lockfile"
          done
