name: Security Audit

on:
  push:
    branches:
      - main
      - master
      - draft/evm-kasplex-igra-provider-clean
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: autobuild
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java for Android build
        if: matrix.language == 'cpp' || matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Autobuild compiled source
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Build Android project while tracing C++ compilation
        if: matrix.language == 'cpp'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Analyze source without uploading to conflicting default Code Scanning setup
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: false

      - name: Upload CodeQL SARIF reports as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: results/${{ matrix.language }}.sarif
          if-no-files-found: warn
          retention-days: 14

  rust-source:
    name: Rust source security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan Rust and shared source with Semgrep
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep scan --config p/rust --config p/security-audit --metrics=off --error .

  rust-dependencies:
    name: Rust dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Audit Rust dependencies when Cargo.lock exists
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t lockfiles < <(find . -name Cargo.lock -not -path './target/*' -not -path './.git/*' -print)
          if (( ${#lockfiles[@]} == 0 )); then
            echo 'No Cargo.lock found; no locked Rust dependency graph to audit.'
            exit 0
          fi
          cargo install cargo-audit --locked
          for lockfile in "${lockfiles[@]}"; do
            echo "Auditing Rust dependencies in $(dirname "$lockfile")"
            cargo audit --file "$lockfile"
          done
