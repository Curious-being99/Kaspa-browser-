name: Shared Rust Core Tests

on:
  pull_request:
    branches: [main, master]
    paths:
      - "kaspasearch-engine/**"
      - "kaspasearch-core/**"
      - "desktop/linux/cef/**"
      - ".github/workflows/shared-rust-core.yml"
  push:
    branches: [main, master]
    paths:
      - "kaspasearch-engine/**"
      - "kaspasearch-core/**"
      - "desktop/linux/cef/**"
      - ".github/workflows/shared-rust-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core-tests:
    name: Test shared browser API and Linux CEF adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kaspasearch-engine
            kaspasearch-core
      - name: Run Rust unit tests
        run: cargo test --manifest-path kaspasearch-core/Cargo.toml
      - name: Validate Linux CEF smoke-test script
        run: python3 -m py_compile desktop/linux/cef/tests/render_smoke.py
