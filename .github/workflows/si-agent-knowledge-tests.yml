name: SI Agent Knowledge Tests

on:
  push:
    branches:
      - feature/si-agent-continuous-knowledge
  pull_request:
    branches:
      - feature/si-agent-memory-web-intelligence
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  si-agent-knowledge-unit-tests:
    name: SI Agent knowledge store unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Rust toolchain for KCC20 script engine
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$HOME/.cargo"
          mkdir -p "$CARGO_HOME/bin"
          cargo install cargo-ndk --version 3.5.4 --locked --root "$CARGO_HOME" --force
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo ndk --version

      - name: Checkout pinned Argent compiler
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/argent-lang/argent.git "$RUNNER_TEMP/argent"
          git -C "$RUNNER_TEMP/argent" checkout 9a9f4b107116d0b259fae629f200fa3b663e7e9d
          test "$(git -C "$RUNNER_TEMP/argent" rev-parse HEAD)" = "9a9f4b107116d0b259fae629f200fa3b663e7e9d"
          echo "ARGENT_COMPILER_MANIFEST=$RUNNER_TEMP/argent/Cargo.toml" >> "$GITHUB_ENV"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.7.0'

      - name: Run Android debug unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload SI Agent test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: si-agent-knowledge-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
