name: EVM RPC Smoke Checks

on:
  push:
    branches:
      - draft/evm-kasplex-igra-provider-clean
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-smoke:
    name: Verify ${{ matrix.network }} RPC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: Kasplex Mainnet
            rpc_url: https://evmrpc.kasplex.org
            expected_chain_id: "0x3173b"
          - network: Igra Mainnet
            rpc_url: https://rpc.igralabs.com:8545
            expected_chain_id: "0x97b1"
    steps:
      - name: Check live chain ID and block height
        env:
          RPC_URL: ${{ matrix.rpc_url }}
          EXPECTED_CHAIN_ID: ${{ matrix.expected_chain_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          response="$(curl --fail --silent --show-error --max-time 20 -H 'content-type: application/json' --data "$payload" "$RPC_URL")"
          actual_chain_id="$(jq -er '.result | strings' <<< "$response")"
          if [[ "${actual_chain_id,,}" != "${EXPECTED_CHAIN_ID,,}" ]]; then
            echo "Chain ID mismatch: expected $EXPECTED_CHAIN_ID, got $actual_chain_id"
            exit 1
          fi
          block_payload='{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}'
          block_response="$(curl --fail --silent --show-error --max-time 20 -H 'content-type: application/json' --data "$block_payload" "$RPC_URL")"
          block_number="$(jq -er '.result | strings' <<< "$block_response")"
          if [[ ! "$block_number" =~ ^0x[0-9a-fA-F]+$ ]] || (( 16#${block_number#0x} < 1 )); then
            echo "Invalid or unavailable block height: $block_number"
            exit 1
          fi
          echo "Verified chain ID $actual_chain_id and live block height $block_number"
