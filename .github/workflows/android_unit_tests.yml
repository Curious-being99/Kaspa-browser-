name: Android Unit Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Debug Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - run: gradle testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-reports
          path: |
            **/build/test-results/testDebugUnitTest/
            **/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  kaspa-dapp-webview-emulator:
    name: Kaspa dApp WebView emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator'
      - name: Accept SDK licenses and install emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "system-images;android-35;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Create clean API 35 AVD
        run: |
          echo "no" | avdmanager create avd --force --name kaspa-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
      - name: Boot emulator and run instrumentation tests
        timeout-minutes: 45
        run: |
          set -Eeuo pipefail
          adb start-server
          emulator -avd kaspa-api35 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -no-metrics -gpu swiftshader_indirect -memory 4096 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          echo "Waiting up to 180 seconds for the emulator transport..."
          if ! timeout 180s adb -s emulator-5554 wait-for-device; then
            echo "ADB never saw emulator-5554. Emulator process state:"
            ps -p "$EMULATOR_PID" -o pid,stat,etime,cmd || true
            echo "Emulator startup log:"
            cat "$RUNNER_TEMP/emulator.log" || true
            adb devices -l || true
            exit 1
          fi
          echo "ADB transport connected; waiting up to 15 minutes for Android boot."
          deadline=$((SECONDS + 900))
          booted=0
          while (( SECONDS < deadline )); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before Android boot completed."
              cat "$RUNNER_TEMP/emulator.log" || true
              adb devices -l || true
              exit 1
            fi
            state="$(timeout 15s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$state" == "1" ]]; then
              booted=1
              break
            fi
            sleep 5
          done
          if [[ "$booted" != "1" ]]; then
            echo "Android did not complete boot within 15 minutes."
            cat "$RUNNER_TEMP/emulator.log" || true
            timeout 30s adb -s emulator-5554 logcat -d -t 500 || true
            exit 1
          fi
          echo "Emulator boot completed:"
          adb devices -l
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          echo "Starting connectedDebugAndroidTest."
          gradle connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumentation reports and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaspa-dapp-webview-instrumentation-reports
          path: |
            **/build/outputs/androidTest-results/connected/
            **/build/reports/androidTests/connected/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
