name: Android Unit Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Debug Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - run: gradle testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-reports
          path: |
            **/build/test-results/testDebugUnitTest/
            **/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  kaspa-dapp-webview-emulator:
    name: Kaspa dApp WebView emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Run WebView instrumentation tests on stable API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          channel: stable
          cores: 2
          heap-size: 2048M
          disk-size: 6G
          emulator-boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaspa-dapp-webview-instrumentation-reports
          path: |
            **/build/outputs/androidTest-results/connected/
            **/build/reports/androidTests/connected/
          if-no-files-found: warn
