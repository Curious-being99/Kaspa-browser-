[package]
name = "kazium-kcc20-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
kaspa-consensus-core = "=2.1.0"
kaspa-txscript = "=2.1.0"
kaspa-hashes = { version = "=2.1.0", default-features = false }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std", "serde"] }
serde_json = "1.0.107"
jni = "0.21.1"
