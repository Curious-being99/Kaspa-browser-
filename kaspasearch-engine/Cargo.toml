[package]
name = "kaspasearch-engine"
version = "9.0.0"
edition = "2021"

[lib]
name = "kaspasearch"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli"] }
tower-http = { version = "0.5", features = ["cors", "compression-full", "trace"] }
tantivy = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.19"
url = "2.5"
regex = "1.10"
urlencoding = "2.1"
html5ever = "0.27"
