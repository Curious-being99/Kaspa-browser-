# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override
# any settings specified in this file.
# For more details about configuring your build environment, visit
# https://docs.gradle.org/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle daemon.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Enables parallel execution for decoupled projects.
org.gradle.parallel=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class.
android.nonTransitiveRClass=true

org.gradle.caching=true
org.gradle.configuration-cache=true

# Limit workers to avoid overloading constrained CI runners.
org.gradle.workers.max=4

# Do not force Kotlin compilation into the Gradle process. Use Kotlin's
# default compiler-daemon strategy so compiler plugins run in their intended
# isolated process rather than sharing Gradle's application/classloader state.
# This avoids a known class of compiler-plugin failures involving missing
# IntelliJ Application instances during Kotlin compilation.

# Allow the Google Services plugin to work when google-services.json is absent.
googleServices.missing.passthrough=true
